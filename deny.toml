# cargo-deny: what the dependencies may be. CI runs `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
# Vulnerabilities, yanked versions and unmaintained crates all fail the
# check unless listed here, each with why it's accepted.
yanked = "deny"
unmaintained = "all"
ignore = [
    # lofty's proc macro, at build time only: nothing of it runs in the app.
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time macro used by lofty; no replacement upstream yet" },
    # The D-Bus types under egui's screen reader support (accesskit, atspi).
    # Successors are named in the advisories; waits on accesskit to move.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, reached only through egui's accesskit; no fixed version" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, reached only through egui's accesskit; no fixed version" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, reached only through egui's accesskit; no fixed version" },
]

[licenses]
# Each must be compatible with the app's GPL-3.0-or-later. A crate offering
# a choice (MIT OR Apache-2.0) passes when any one of its choices is here.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots: Mozilla's list of root certificates, as data.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are GPL-3.0-or-later and never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's crates refer to each other by path; they're never published.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
