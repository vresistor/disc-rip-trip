[workspace]
resolver = "2"
members = ["crates/engine", "crates/steps", "crates/cli", "crates/layout", "app"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Each crate names the tokio features it uses.
tokio = { version = "1", default-features = false }
tokio-util = "0.7"

# Debug builds keep line tables only, and none for dependencies: backtraces
# still say where, and target/ stays a few GB instead of twenty.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
