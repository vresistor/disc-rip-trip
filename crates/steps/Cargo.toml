[package]
name = "drt-steps"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The steps a recipe is made of, and the built-in recipes"

[dependencies]
drt-engine = { path = "../engine" }
libc = "0.2"
# CHD through MAME's own CHD core, in-process: real progress and a Stop that
# works. Built from the vendored source (no `prebuilt`, which downloads in
# build.rs and so can't build offline in the flatpak builder).
libchdman-rs = "0.289"
# Redump's datfiles: zipped Logiqx XML.
quick-xml = "0.41"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Hashing a dump, with progress and Stop, in one pass for all three.
crc32fast = "1"
md-5 = "0.10"
sha1 = "0.11"
# Writing the tags ffmpeg can't (an ID3 UFID frame, MP4 freeform atoms), and
# `drt fix-tags`. Read without its conversions, so nothing else changes.
lofty = { version = "=0.24.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "process", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
